<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>村の人たち アプリ統合ポータル</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
    .app-card:hover { transform: translateY(-4px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-white/20 p-2.5 rounded-xl backdrop-blur-sm">
          <i class="fa-solid fa-cubes text-2xl text-amber-300"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">村の人たち アプリ統合ポータル</h1>
          <p class="text-xs text-indigo-200">28個の診断・ツールへ1タップでアクセス</p>
        </div>
      </div>
      
      <!-- 検索バー -->
      <div class="relative w-full sm:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-indigo-300"></i>
        <input type="text" id="searchInput" oninput="filterApps()" placeholder="アプリ名やキーワードで検索..." 
               class="w-full pl-9 pr-4 py-2 bg-indigo-800/60 border border-indigo-500/50 rounded-lg text-sm text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex-1 w-full">
    
    <!-- カテゴリタブ -->
    <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-6 scrollbar-none" id="categoryTabs">
      <!-- JavaScriptで動的生成 -->
    </div>

    <!-- アプリ件数表示 -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2" id="sectionTitle">
        <i class="fa-solid fa-grid-2 text-indigo-600"></i> すべてのアプリ
      </h2>
      <span class="text-xs font-semibold bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-full" id="appCount">28 件</span>
    </div>

    <!-- アプリカードグリッド -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="appGrid">
      <!-- JavaScriptでカードを生成 -->
    </div>

    <!-- 検索結果なしメッセージ -->
    <div id="noResults" class="hidden text-center py-16">
      <i class="fa-solid fa-ghost text-4xl text-slate-300 mb-3"></i>
      <p class="text-slate-500 font-medium">該当するアプリが見つかりませんでした。</p>
    </div>
  </main>

  <!-- フッター -->
  <footer class="bg-white border-t border-slate-200 py-4 mt-8">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
      &copy; 村の人たち App Collection. All rights reserved.
    </div>
  </footer>

  <!-- モーダル（アプリプレビュー用） -->
  <div id="appModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-2 sm:p-4">
    <div class="bg-white rounded-2xl w-full max-w-5xl h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-5 py-3 bg-slate-800 text-white flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span id="modalIcon" class="text-xl"></span>
          <h3 id="modalTitle" class="font-bold text-base"></h3>
          <span id="modalSlug" class="text-xs text-slate-400 hidden sm:inline"></span>
        </div>
        <div class="flex items-center space-x-2">
          <a id="modalExternalLink" href="#" target="_blank" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-medium flex items-center gap-1 transition">
            新タブで開く <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 rounded-lg">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>
      </div>
      <div class="flex-1 bg-slate-100 relative">
        <iframe id="modalFrame" class="w-full h-full border-0" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <script>
    // 28個のアプリデータ設定
    const apps = [
      // 💼 キャリア・年収・転職
      { id: 'tennsyokukanousei', name: '転職可能性診断', path: 'muranohitotati/tennsyokukanousei', cat: 'career', icon: '💼', desc: '転職の可能性や市場価値を多角的に診断します。' },
      { id: 'tekiseinennsyuu', name: '適正年収診断', path: 'muranohitotati/tekiseinennsyuu', cat: 'career', icon: '📊', desc: '現在のスキルや経験に基づく適性年収を算出。' },
      { id: 'salary-diagnosis-tool', name: '給与診断ツール', path: 'muranohitotati/salary-diagnosis-tool', cat: 'career', icon: '💰', desc: '給与体系や昇給シミュレーションを行う診断ツール。' },
      { id: 'tekisyokusoudann', name: '適職相談', path: 'muranohitotati/tekisyokusoudann', cat: 'career', icon: '🗣️', desc: '自分に合った職種やキャリアパスを見つける相談。' },
      { id: 'bannsousya', name: '伴走者', path: 'muranohitotati/bannsousya', cat: 'career', icon: '🤝', desc: 'キャリア支援や目標達成を個別サポートする伴走機能。' },

      // 🚀 副業・ビジネス・収益化
      { id: 'fukugyouseikou', name: '副業成功診断', path: 'muranohitotati/fukugyouseikou', cat: 'sidebiz', icon: '🚀', desc: '副業で成果を出すための適性と攻略法を提案。' },
      { id: 'sumo-rubizinesu', name: 'スモールビジネス', path: 'muranohitotati/sumo-rubizinesu', cat: 'sidebiz', icon: '🏪', desc: '個人や小規模で始められるビジネスモデルの構築。' },
      { id: 'fukugyou-syuunyuu', name: '副業収入計算', path: 'muranohitotati/fukugyou-syuunyuu', cat: 'sidebiz', icon: '💵', desc: '副業での見込み収入や収益化計画を計算。' },
      { id: 'kaisyawoatm', name: '会社をATM化思考', path: 'muranohitotati/kaisyawoatm', cat: 'sidebiz', icon: '🏦', desc: '本業の安定を活用して副業を育てるキャリア戦術。' },
      { id: 'kaneninaru', name: '金になるスキル', path: 'muranohitotati/kaneninaru', cat: 'sidebiz', icon: '💎', desc: '持っている経験や特技を収益化するポイント分析。' },
      { id: '50daikanoouenngaido', name: '50代からの応援ガイド', path: 'muranohitotati/50daikanoouenngaido', cat: 'sidebiz', icon: '👴', desc: 'セカンドキャリアや50代からの挑戦を支えるガイド。' },
      { id: 'fukugyou-kannzennkouryaku', name: '副業完全攻略', path: 'muranohitotati/fukugyou-kannzennkouryaku', cat: 'sidebiz', icon: '📈', desc: 'ゼロから収益化までのステップを完全網羅。' },
      { id: 'fukyugyou-keikaku', name: '副業計画作成', path: 'muranohitotati/fukyugyou-keikaku', cat: 'sidebiz', icon: '📝', desc: '無理のないスケジュールで副業を進める計画ツール。' },
